<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WebView</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 90%;
            text-align: center;
        }
        
        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .status {
            margin: 20px 0;
            padding: 15px;
            background: #e8f5e9;
            border-left: 4px solid #4CAF50;
            border-radius: 5px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test WebView Android</h1>
        
        <button class="btn-primary" id="btn-test">
            Abrir Modal
        </button>
        
        <button class="btn-success" id="btn-alert">
            Mostrar Alerta
        </button>
        
        <button class="btn-danger" id="btn-log">
            Escribir en Console
        </button>
        
        <div class="status" id="status">
            ✅ Click funcionó correctamente
        </div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>🎉 ¡Modal Funcionando!</h2>
            <p>El click en WebView funciona perfectamente</p>
            <br>
            <button class="btn-primary" id="btn-close">
                Cerrar
            </button>
        </div>
    </div>
    
    <script>
        console.log('🔧 JavaScript iniciado');
        
        // Función para abrir modal
        function openModal() {
            console.log('📱 Abriendo modal...');
            document.getElementById('modal').classList.add('active');
            console.log('✅ Modal abierto');
        }
        
        // Función para cerrar modal
        function closeModal() {
            console.log('📱 Cerrando modal...');
            document.getElementById('modal').classList.remove('active');
            console.log('✅ Modal cerrado');
        }
        
        // Función para mostrar status
        function showStatus() {
            console.log('📱 Mostrando status...');
            var status = document.getElementById('status');
            status.classList.add('show');
            setTimeout(function() {
                status.classList.remove('show');
            }, 2000);
        }
        
        // Espera a que el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOM listo');
            
            // Botón abrir modal
            document.getElementById('btn-test').addEventListener('click', function(e) {
                console.log('👆 Click en botón TEST');
                openModal();
                showStatus();
            });
            
            // Botón mostrar alerta
            document.getElementById('btn-alert').addEventListener('click', function(e) {
                console.log('👆 Click en botón ALERT');
                alert('¡Los clicks funcionan en WebView!');
                showStatus();
            });
            
            // Botón escribir en console
            document.getElementById('btn-log').addEventListener('click', function(e) {
                console.log('👆 Click en botón LOG');
                console.log('🎯 ¡Esto se escribe desde el WebView!');
                showStatus();
            });
            
            // Botón cerrar modal
            document.getElementById('btn-close').addEventListener('click', function(e) {
                console.log('👆 Click en botón CLOSE');
                closeModal();
            });
            
            console.log('✅ Event listeners agregados');
        });
    </script>
</body>
</html>
